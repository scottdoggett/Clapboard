<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clapboard</title>
    <!--
      Clapboard Popup HTML Shell

      This is the HTML entry point for the browser action popup.
      The React app is mounted into the #root element.

      Note: Popup dimensions are set via CSS in the body/root elements.
      Chrome extensions have a max popup width of 800px and height of 600px.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        width: 320px;
        min-height: 280px;
      }
    </style>
    <!-- Compiled CSS will be injected here during build -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Compiled JS will be injected here during build -->
    <script type="module" src="index.js"></script>
  </body>
</html>
